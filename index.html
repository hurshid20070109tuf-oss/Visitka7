<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Визитка - Bizning Go'sht</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Подключаем библиотеку для создания скриншотов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-card: linear-gradient(145deg, #1a1a1f 0%, #0d0d0f 100%);
            --gold: #c9a962;
            --gold-light: #e8d5a3;
            --gold-dark: #8b7355;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border: rgba(201, 169, 98, 0.2);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(201, 169, 98, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 169, 98, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hint {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .card-wrapper {
            perspective: 2000px;
            width: 380px;
            height: 520px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(201, 169, 98, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .card-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
        }

        /* Front side */
        .card-front {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 35px;
        }

        .card-front .header {
            text-align: left;
        }

        .logo {
            width: 50px;
            height: 50px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: 3px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .title {
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .card-front .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .decorative-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--gold) 20%, 
                var(--gold) 80%, 
                transparent 100%);
            position: relative;
        }

        .decorative-line::before {
            content: '✦';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-primary);
            padding: 0 15px;
            color: var(--gold);
            font-size: 0.8rem;
        }

        .card-front .footer {
            text-align: right;
        }

        .company {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            font-weight: 400;
        }

        .tagline {
            font-size: 0.65rem;
            color: var(--gold-dark);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Back side */
        .card-back {
            transform: rotateY(180deg);
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
        }

        .card-back .header {
            margin-bottom: 35px;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--text-primary);
            letter-spacing: 3px;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .section-subtitle {
            font-size: 0.65rem;
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .contact-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(201, 169, 98, 0.1);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            padding-left: 10px;
            border-bottom-color: var(--gold);
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .contact-item:hover .contact-icon {
            border-color: var(--gold);
            background: rgba(201, 169, 98, 0.1);
        }

        .contact-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.5;
        }

        .contact-info {
            text-align: left;
        }

        .contact-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .contact-value {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .card-back .footer {
            margin-top: 30px;
            text-align: center;
        }

        .qr-hint {
            font-size: 0.6rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: auto;
        }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
        }

        .corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* Кнопка скачивания */
        .download-btn {
            margin-top: 35px;
            background: transparent;
            color: var(--gold);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1s ease 0.8s forwards;
        }

        .download-btn:hover {
            background: rgba(201, 169, 98, 0.1);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(201, 169, 98, 0.1);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-wrapper {
            animation: fadeIn 1s ease forwards;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-wrapper {
                width: 320px;
                height: 450px;
            }

            .card-face {
                padding: 30px 25px;
            }

            .card-front {
                padding: 30px 25px;
            }

            .card-back {
                padding: 30px 25px;
            }

            .name {
                font-size: 1.9rem;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .logo::after {
                width: 16px;
                height: 16px;
            }

            .contact-item {
                gap: 12px;
                padding: 12px 0;
            }

            .contact-icon {
                width: 35px;
                height: 35px;
            }

            .contact-value {
                font-size: 0.85rem;
            }

            .section-title {
                font-size: 1.3rem;
            }
        }

        @media (min-width: 768px) {
            .card-wrapper {
                width: 420px;
                height: 560px;
            }

            .card-front {
                padding: 50px 45px;
            }

            .card-back {
                padding: 50px 45px;
            }

            .name {
                font-size: 2.8rem;
            }
        }

        /* Hover glow effect */
        .card:hover .card-face {
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(201, 169, 98, 0.2),
                0 0 60px -30px rgba(201, 169, 98, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="hint">Click on the card to turn it over</p>
        
        <div class="card-wrapper">
            <div class="card" onclick="this.classList.toggle('flipped')">
                <!-- Front Side -->
                <div class="card-face card-front" id="cardToDownload">
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                    
                    <div class="header">
                        <div class="logo"></div>
                        <h1 class="name">Boymirzayev<br>Islomjon</h1>
                        <p class="title">Founder</p>
                    </div>
                    
                    <div class="main">
                        <div class="decorative-line"></div>
                    </div>
                    
                    <div class="footer">
                        <p class="company">Bizning Go'sht</p>
                        <p class="tagline">Frozen Meat Wholesale</p>
                    </div>
                </div>
                
                <!-- Back Side -->
                <div class="card-face card-back">
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                     
                    <div class="header">
                        <h2 class="section-title">Contacts</h2>
                        <p class="section-subtitle">contact me</p>
                    </div>
                    
                    <div class="contact-list">
                        <div class="contact-item">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            </div>
                            <div class="contact-info">
                                <p class="contact-label">Number</p>
                                <p class="contact-value">+998 94-666-66-64</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            </div>
                            <div class="contact-info">
                                <p class="contact-label">Email</p>
                                <p class="contact-value">islomgosht@gmail.com</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            </div>
                            <div class="contact-info">
                                <p class="contact-label">Adress</p>
                                <p class="contact-value">Uzbekistan Tashkent Oybek 50, 54</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            </div>
                            <div class="contact-info">
                                <p class="contact-label">Opening hours</p>
                                <p class="contact-value">Mon–Sat: 9:00–22:00</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="footer">
                        <p class="qr-hint">Bizninggosht.uz</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопка скачивания -->
        <button id="downloadBtn" class="download-btn">
            Сохранить как фото
        </button>
    </div>

    <!-- Скрипт для скачивания -->
    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const card = document.getElementById('cardToDownload');
            const btn = this;
            
            // Меняем текст на время загрузки
            const originalText = btn.innerText;
            btn.innerText = 'Сохранение...';

            html2canvas(card, {
                backgroundColor: '#0a0a0b', // Цвет фона под карточкой
                scale: 3, // Улучшенное качество картинки
                logging: false,
                useCORS: true
            }).then(canvas => {
                // Создаем ссылку для скачивания
                const link = document.createElement('a');
                link.download = 'Bizning_Gosht_Card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Возвращаем текст кнопке
                btn.innerText = originalText;
            }).catch(err => {
                console.error("Ошибка при сохранении:", err);
                btn.innerText = 'Ошибка сохранения';
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        });
    </script>
</body>
</html>
