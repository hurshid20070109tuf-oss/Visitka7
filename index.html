<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Визитка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-card: linear-gradient(145deg, #1a1a1f 0%, #0d0d0f 100%);
            --gold: #c9a962;
            --gold-light: #e8d5a3;
            --gold-dark: #8b7355;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border: rgba(201, 169, 98, 0.2);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(201, 169, 98, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 169, 98, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .hint {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .card-wrapper {
            perspective: 2000px;
            width: 380px;
            height: 520px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(201, 169, 98, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .card-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
        }

        /* Front side */
        .card-front {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 35px;
        }

        .card-front .header {
            text-align: left;
        }

        .logo {
            width: 50px;
            height: 50px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: 3px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .title {
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .card-front .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .decorative-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--gold) 20%, 
                var(--gold) 80%, 
                transparent 100%);
            position: relative;
        }

        .decorative-line::before {
            content: '✦';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-primary);
            padding: 0 15px;
            color: var(--gold);
            font-size: 0.8rem;
        }

        .card-front .footer {
            text-align: right;
        }

        .company {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            font-weight: 400;
        }

        .tagline {
            font-size: 0.65rem;
            color: var(--gold-dark);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Back side */
        .card-back {
            transform: rotateY(180deg);
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
        }

        .card-back .header {
            margin-bottom: 35px;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--text-primary);
            letter-spacing: 3px;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .section-subtitle {
            font-size: 0.65rem;
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .contact-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(201, 169, 98, 0.1);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            padding-left: 10px;
            border-bottom-color: var(--gold);
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .contact-item:hover .contact-icon {
            border-color: var(--gold);
            background: rgba(201, 169, 98, 0.1);
        }

        .contact-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.5;
        }

        .contact-info {
            text-align: left;
        }

        .contact-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .contact-value {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .card-back .footer {
            margin-top: 30px;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-link {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-link:hover {
            border-color: var(--gold);
            background: rgba(201, 169, 98, 0.15);
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 16px;
            height: 16px;
            fill: var(--gold);
        }

        .qr-hint {
            font-size: 0.6rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
        }

        .corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .card-wrapper {
            animation: fadeIn 1s ease forwards;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-wrapper {
                width: 320px;
                height: 450px;
            }

            .card-face {
                padding: 30px 25px;
            }

            .card-front {
                padding: 30px 25px;
            }

            .card-back {
                padding: 30px 25px;
            }

            .name {
                font-size: 1.9rem;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .logo::after {
                width: 16px;
                height: 16px;
            }

            .contact-item {
                gap: 12px;
                padding: 12px 0;
            }

            .contact-icon {
                width: 35px;
                height: 35px;
            }

            .contact-value {
                font-size: 0.85rem;
            }

            .section-title {
                font-size: 1.3rem;
            }
        }

        @media (min-width: 768px) {
            .card-wrapper {
                width: 420px;
                height: 560px;
            }

            .card-front {
                padding: 50px 45px;
            }

            .card-back {
                padding: 50px 45px;
            }

            .name {
                font-size: 2.8rem;
            }
        }

        /* Hover glow effect */
        .card:hover .card-face {
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(201, 169, 98, 0.2),
                0 0 60px -30px rgba(201, 169, 98, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
